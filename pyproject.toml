[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-call-transcriber"
version = "0.1.0"
description = "Aplicación local para Windows de transcripción de llamadas"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["faster-whisper==1.2.1"]

[project.optional-dependencies]
gui = ["PySide6==6.8.3"]

[project.scripts]
local-call-transcriber = "local_call_transcriber.cli:main"

[project.gui-scripts]
local-call-transcriber-gui = "local_call_transcriber.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
